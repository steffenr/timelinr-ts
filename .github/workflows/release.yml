name: Release

# Publishes to npm whenever a v* tag is pushed, via npm TRUSTED PUBLISHING
# (OIDC) — no NPM_TOKEN secret involved. The one-time setup lives on npmjs.com:
# package timelinr-ts -> Settings -> Trusted Publishers -> GitHub
# repository timelinr-ts, workflow file "release.yml". The id-token
# permission below is what lets npm verify the run's identity; dist/ is built
# here from the tagged source. prepublishOnly (test + typecheck + build:lib)
# runs automatically as part of `npm publish`, so the tarball can never ship
# untested or stale.
#
# If trusted publishing is ever unavailable, fall back to a GRANULAR access
# token with the 2FA-bypass option enabled (classic/automation tokens are
# rejected) as the NPM_TOKEN secret, and put
#   env:
#     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
# back on the publish step.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --provenance
